packages:
  - ./
  - .playground/

catalogs:
  cli:
    '@antfu/eslint-config': ^6.7.3
    '@antfu/ni': ^27.0.1
    bumpp: ^10.4.1
    eslint: ^9.39.5
    tsdown: ^0.22.14
    typescript: ^5.9.3
    vite: ^7.3.6
  inlined:
    '@antfu/utils': ^9.3.0
  playground:
    nuxt: ^4.5.2
    vue: ^3.5.34
    vue-router: ^4.6.4
  types:
    '@types/node': ^24.13.3

ignoreWorkspaceRootCheck: true

allowBuilds:
  '@parcel/watcher': true
  esbuild: true

shellEmulator: true

minimumReleaseAgeExclude:
  - shell-quote@1.8.4 || 1.8.5
  - tar@7.5.16 || 7.5.17 || 7.5.18 || 7.5.19 || 7.5.21
  - launch-editor@2.14.1
  - nuxt@4.4.7 || 4.5.1
  - ws@8.21.0
  - '@babel/core@7.29.1'
  - svgo@4.0.2
  - brace-expansion@5.0.8 || 5.0.9
  - postcss@8.5.23
  - undici@8.9.0
  - '@nuxt/devtools@3.3.1'
  - js-yaml@4.3.1
  - nanoid@3.3.18

overrides:
  brace-expansion@<=5.0.7: ^5.0.8
  brace-expansion@>=4.0.0 <5.0.9: ^5.0.9
  nanoid@<3.3.18: ^3.3.18
  postcss@<=8.5.22: ^8.5.23
